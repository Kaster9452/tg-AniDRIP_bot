<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AniDRIP — панель модерации</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap&subset=cyrillic,latin" rel="stylesheet">
<style>
:root{
  --ink:#12111A;
  --slate:#1C1B27;
  --haze:#2A2838;
  --bone:#EDEAF5;
  --mist:#8F8AA6;
  --rose:#FF5C9E;
  --citrus:#FFD166;
  --mint:#5BE9B9;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ink);
  font-family:'Manrope',system-ui,sans-serif;
  color:var(--bone);
  min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:520px;margin:0 auto}

.head{padding:18px 18px 12px;display:flex;align-items:flex-start;gap:12px}
.menu-btn{margin-left:auto;display:flex;align-items:center;gap:6px;cursor:pointer;
  background:var(--slate);border:1px solid var(--haze);color:var(--bone);
  border-radius:12px;padding:9px 12px;font-family:'Manrope',sans-serif;
  font-weight:600;font-size:12px;transition:border-color .18s ease,color .18s ease}
.menu-btn:hover{border-color:var(--rose);color:var(--rose)}
.menu-btn:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mist);
}
.title{
  font-family:'Unbounded',sans-serif;font-weight:800;font-size:26px;
  letter-spacing:-.02em;margin-top:6px;line-height:1.05;
}
.title em{font-style:normal;color:var(--rose)}

.stats{display:flex;gap:8px;padding:0 18px 16px}
.stat{flex:1;background:var(--slate);border:1px solid var(--haze);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:600;line-height:1}
.stat span{font-size:10px;color:var(--mist)}
.stat.is-new b{color:var(--rose)}
.stat.is-queued b{color:var(--citrus)}
.stat.is-done b{color:var(--mint)}

/* ── строка «Свой пост» ── */
.mine{display:flex;align-items:center;gap:11px;width:calc(100% - 36px);margin:0 18px 16px;
  cursor:pointer;text-align:left;border-radius:15px;padding:13px 14px;
  font-family:'Manrope',sans-serif;color:var(--bone);
  background:var(--slate);border:1px solid var(--haze);border-left:3px solid var(--rose);
  transition:border-color .18s ease,transform .12s ease}
.mine:hover{border-color:var(--rose);transform:translateY(-1px)}
.mine:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.mine b{font-weight:600;font-size:13px;display:block;line-height:1.25}
.mine small{font-size:11px;color:var(--mist)}
.mine .plus{width:30px;height:30px;flex:none;border-radius:10px;display:grid;place-items:center;
  font-family:'Unbounded',sans-serif;font-weight:600;font-size:16px;
  background:rgba(255,92,158,.16);color:var(--rose)}
.mine .next{margin-left:auto;flex:none;text-align:right}
.mine .next em{display:block;font-style:normal;font-family:'JetBrains Mono',monospace;
  font-size:15px;font-weight:600;color:var(--mint);line-height:1.1}
.mine .next span{font-size:9px;color:var(--mist);letter-spacing:.04em;text-transform:uppercase}

/* ── экран «Свой пост» ── */
/* сетка слотов внутри карточки — компактнее, чем на отдельном экране */
.step .days{margin-bottom:8px;padding:3px}
.step .day{padding:6px 3px;font-size:11px;border-radius:9px}
.step .grid{gap:6px}
.step .slot{padding:8px 8px 7px;border-radius:12px}
.step .slot-time{font-size:13px}
.step .slot-state{font-size:9px;margin-top:2px}
.step .slot-dot{top:8px;right:8px;width:5px;height:5px}
.step .field{margin-top:10px}
.own-label{display:flex;align-items:baseline;gap:8px;margin:0 0 9px}
.own-label b{font-family:'Unbounded',sans-serif;font-weight:600;font-size:12px;letter-spacing:.02em}
.own-label span{font-size:11px;color:var(--mist)}
.editor{background:var(--slate);border:1px solid var(--haze);border-radius:18px;padding:14px;
  transition:border-color .18s ease}
.editor:focus-within{border-color:var(--rose)}
.editor textarea{width:100%;min-height:104px;resize:vertical;border:0;outline:0;background:transparent;
  color:var(--bone);font-family:'Manrope',sans-serif;font-size:14px;line-height:1.5}
.editor textarea::placeholder{color:#5E5975}
.editor-foot{display:flex;align-items:center;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--haze)}
.count{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mist)}
.count.over{color:var(--rose)}

/* Переключатель дня — цельная планка, а не три отдельные плитки:
   иначе он сливается с сеткой слотов, где плитки такие же. */
.days{display:flex;gap:4px;margin-bottom:13px;padding:4px;
  background:var(--haze);border-radius:14px}
.day{flex:1;cursor:pointer;background:transparent;border:0;color:var(--mist);
  border-radius:10px;padding:8px 4px;font-family:'Manrope',sans-serif;font-weight:600;font-size:12px;
  display:grid;gap:2px;justify-items:center;transition:background .18s ease,color .18s ease}
.day small{font-family:'JetBrains Mono',monospace;font-size:9px;opacity:.7}
.day:hover{color:var(--bone)}
.day:focus-visible{outline:2px solid var(--rose);outline-offset:-2px}
.day[aria-pressed="true"]{background:var(--rose);color:#1A0A12}
.day[aria-pressed="true"] small{opacity:.8}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{position:relative;cursor:pointer;text-align:left;
  background:var(--slate);border:1px solid var(--haze);color:var(--bone);
  border-radius:15px;padding:11px 11px 10px;font-family:'JetBrains Mono',monospace;
  transition:border-color .18s ease,background .18s ease,transform .12s ease}
.slot:hover:not(:disabled){border-color:var(--mist);transform:translateY(-1px)}
.slot:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.slot-time{font-size:15px;font-weight:600;letter-spacing:-.02em;display:block}
.slot-state{display:block;margin-top:3px;font-family:'Manrope',sans-serif;
  font-size:10px;font-weight:600;color:var(--mist);line-height:1.3}
.slot-dot{position:absolute;top:11px;right:11px;width:6px;height:6px;border-radius:50%;
  background:var(--mint)}
.slot.is-taken{background:#241F14;border-color:#4A3D1C}
.slot.is-taken .slot-state{color:var(--citrus)}
.slot.is-taken .slot-dot{background:var(--citrus)}
.slot:disabled{cursor:not-allowed;opacity:.4;background:var(--ink)}
.slot:disabled .slot-dot{display:none}
.slot[aria-pressed="true"]{background:#2E1B29;border-color:var(--rose)}
.slot[aria-pressed="true"] .slot-state{color:var(--rose)}
.slot[aria-pressed="true"] .slot-dot{background:var(--rose);box-shadow:0 0 0 4px rgba(255,92,158,.18)}

.own-hint{margin-top:11px;font-size:11px;line-height:1.45;color:var(--mist)}
.own-hint b{color:var(--citrus);font-weight:600}

.own-foot{padding:14px 18px calc(14px + env(safe-area-inset-bottom));
  max-width:520px;margin:0 auto;width:100%;
  background:var(--ink);border-top:1px solid var(--haze)}
.go{width:100%;cursor:pointer;border:0;border-radius:15px;padding:15px;
  background:var(--rose);color:#1A0A12;
  font-family:'Unbounded',sans-serif;font-weight:600;font-size:14px;letter-spacing:-.01em;
  transition:opacity .18s ease}
.go:disabled{cursor:not-allowed;background:var(--haze);color:var(--mist)}
.go:focus-visible{outline:2px solid var(--bone);outline-offset:3px}

.tabs{display:flex;gap:4px;margin:0 18px 16px;background:var(--slate);border:1px solid var(--haze);border-radius:14px;padding:4px}
.tab{flex:1;border:0;background:transparent;color:var(--mist);font-family:'Manrope',sans-serif;
  font-weight:600;font-size:13px;padding:9px 4px;border-radius:10px;cursor:pointer;
  transition:background .18s ease,color .18s ease}
.tab[aria-selected="true"]{background:var(--haze);color:var(--bone)}
.tab:focus-visible{outline:2px solid var(--rose);outline-offset:2px}

.scroll{padding:0 18px 32px}
.panel[hidden]{display:none}

.card{background:var(--slate);border:1px solid var(--haze);border-radius:18px;padding:14px;margin-bottom:12px}
.card-top{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.ava{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
  font-family:'Unbounded',sans-serif;font-weight:600;font-size:12px;
  background:linear-gradient(140deg,#3A2A45,#241F30);color:var(--rose)}
.ava-img{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
  font-family:'Unbounded',sans-serif;font-weight:600;font-size:12px;background:#2A2838;color:var(--bone);
  background-size:cover;background-position:center;overflow:hidden}
/* когда аватарка загрузилась — прячем инициалы под картинкой */
.ava-img.has-photo{color:transparent}
.who{font-size:13px;font-weight:600;line-height:1.2}
.when{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mist)}
.tag{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mist);
  background:var(--haze);border-radius:6px;padding:3px 6px}

.body-text{font-size:14px;line-height:1.5;color:#D6D2E4;word-break:break-word}
.media{height:110px;border-radius:12px;margin-bottom:10px;
  background:radial-gradient(120% 90% at 20% 10%, rgba(255,92,158,.30), transparent 60%),
             linear-gradient(150deg,#2E2440,#1A1727);
  border:1px solid var(--haze);display:flex;align-items:flex-end;padding:9px}
.media span{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--bone);
  background:rgba(8,7,13,.6);padding:3px 7px;border-radius:6px}
.media-photo{padding:0;align-items:stretch;cursor:pointer}
.media-photo img{width:100%;height:100%;object-fit:cover;border-radius:11px;display:block}
.media-photo img:hover{filter:brightness(1.05)}

/* модальное окно для просмотра фото */
.photo-modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);animation:fadeIn .18s ease}
.photo-modal[hidden]{display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.photo-modal-close{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:16px;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:background .18s ease}
.photo-modal-close:hover{background:rgba(255,255,255,.2)}
.photo-modal-close:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
.photo-modal-img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.photo-modal-caption{margin-top:14px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mist);text-align:center}

.actions{display:flex;gap:7px;margin-top:12px}
.btn{flex:1;border:0;cursor:pointer;border-radius:11px;padding:11px 6px;
  font-family:'Manrope',sans-serif;font-weight:700;font-size:12.5px;
  transition:transform .12s ease,filter .18s ease}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
.btn-pub{background:var(--rose);color:#1A0A12}
.btn-later{background:var(--haze);color:var(--bone)}
.actions-sub{margin-top:7px}
.btn-ghost{background:transparent;color:var(--mist);border:1px solid var(--haze);font-weight:600}
.btn-ghost:hover{color:var(--bone)}
/* второе нажатие подтверждает: бан задевает живого человека,
   поэтому одним промахом его не выдать */

/* Раскрытие «Опубликовать» / «Отложить».
   Показ через hidden менял высоту карточки рывком. Приём с сеткой
   0fr → 1fr даёт браузеру анимировать настоящую высоту содержимого,
   поэтому карточка плавно раздвигается и так же плавно схлопывается. */
.step{display:grid;grid-template-rows:0fr;opacity:0;overflow:hidden;
  margin-top:0;padding-top:0;border-top:1px dashed transparent;
  transition:grid-template-rows .3s cubic-bezier(.22,.68,.36,1),
             opacity .22s ease,margin-top .3s ease,
             padding-top .3s ease,border-top-color .3s ease}
.step.open{grid-template-rows:1fr;opacity:1;margin-top:10px;padding-top:11px;
  border-top-color:var(--haze)}
.step-in{min-height:0;overflow:hidden}
.step-q{font-size:11px;color:var(--mist);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--haze);background:transparent;color:var(--bone);border-radius:10px;
  padding:8px 12px;cursor:pointer;font-family:'Manrope',sans-serif;font-weight:600;font-size:12px;
  transition:border-color .18s ease,color .18s ease}
.chip:hover{border-color:var(--rose);color:var(--rose)}
.chip:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.chip-mono{font-family:'JetBrains Mono',monospace;font-size:11.5px}
.field{width:100%;margin-top:8px;background:var(--ink);border:1px solid var(--haze);border-radius:10px;
  padding:10px 12px;color:var(--bone);font-family:'JetBrains Mono',monospace;font-size:12px}
.field::placeholder{color:#5E5975}
.field:focus{outline:none;border-color:var(--rose)}

.rail{position:relative;padding-left:30px}
.rail::before{content:"";position:absolute;left:8px;top:6px;bottom:26px;width:2px;border-radius:2px;
  background:linear-gradient(180deg,var(--citrus),rgba(255,209,102,.12))}
.drop{position:relative;margin-bottom:14px}
.drop::before{content:"";position:absolute;left:-27px;top:16px;width:11px;height:11px;
  background:var(--citrus);border-radius:50% 50% 50% 0;transform:rotate(-45deg);
  box-shadow:0 0 0 4px var(--ink)}
.drop.is-next::before{background:var(--rose);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 4px var(--ink),0 0 0 5px rgba(255,92,158,.5)}
  50%{box-shadow:0 0 0 4px var(--ink),0 0 0 11px rgba(255,92,158,0)}
}
.drop-time{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--citrus);
  margin-bottom:5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.drop.is-next .drop-time{color:var(--rose)}
.badge-next{font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  background:rgba(255,92,158,.14);color:var(--rose);padding:2px 6px;border-radius:5px;
  font-family:'Manrope',sans-serif;font-weight:700}
.mini{background:var(--slate);border:1px solid var(--haze);border-radius:14px;padding:11px 12px}
.mini-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.mini-who{font-size:12px;font-weight:600}
.mini-mode{margin-left:auto;font-size:10px;color:var(--mist);border:1px solid var(--haze);
  border-radius:6px;padding:2px 6px;white-space:nowrap}
.mini-text{font-size:12.5px;color:#C9C4DA;line-height:1.45;word-break:break-word}
.mini-acts{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}
.link{background:none;border:0;cursor:pointer;padding:0;font-family:'Manrope',sans-serif;
  font-weight:600;font-size:11.5px;color:var(--mist)}
.link:hover{color:var(--rose)}
.link:disabled{opacity:.5;cursor:default}
.link:focus-visible{outline:2px solid var(--rose);outline-offset:3px;border-radius:3px}

.done{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--haze)}
.done:last-child{border-bottom:0}
.done-mark{width:7px;height:7px;border-radius:50%;background:var(--mint);margin-top:6px;flex:none}
.done-time{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mist)}
.done-text{font-size:12.5px;color:#C9C4DA;line-height:1.45;margin-top:3px;word-break:break-word}
.done-mode{font-size:10px;color:var(--mist);margin-top:4px}

.sheet{position:fixed;inset:0;background:var(--ink);z-index:40;display:flex;flex-direction:column;
  animation:slide .22s ease}
.sheet[hidden]{display:none}
@keyframes slide{from{transform:translateX(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideOut{from{transform:none;opacity:1}to{transform:translateX(14px);opacity:0}}
.sheet.closing{animation:slideOut .2s ease forwards}
.photo-modal.closing{animation:fadeOut .18s ease forwards}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
.sheet-head{display:flex;align-items:center;gap:12px;padding:16px 18px 10px;max-width:520px;
  margin:0 auto;width:100%}
.back{background:var(--slate);border:1px solid var(--haze);color:var(--bone);cursor:pointer;
  width:36px;height:36px;border-radius:11px;font-size:17px;line-height:1;flex:none}
.back:hover{border-color:var(--rose);color:var(--rose)}
.back:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.sheet-title{font-family:'Unbounded',sans-serif;font-weight:800;font-size:21px;
  letter-spacing:-.02em;line-height:1.1}
.sheet-tools{padding:0 18px 14px;max-width:520px;margin:0 auto;width:100%}
.search{margin-top:0;font-family:'Manrope',sans-serif;font-size:13px}
.chip.filter.is-on{border-color:var(--rose);color:var(--rose);background:rgba(255,92,158,.10)}
.sheet-body{flex:1;overflow-y:auto;padding:0 18px 28px;max-width:520px;margin:0 auto;width:100%}

.person{display:flex;gap:11px;align-items:flex-start;background:var(--slate);
  border:1px solid var(--haze);border-radius:16px;padding:12px;margin-bottom:10px}
.person.is-banned{border-color:rgba(255,92,158,.4)}
.person-main{min-width:0;flex:1}
.person-who{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.person-meta{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mist);margin-top:3px}
.person-stats{font-size:11.5px;color:#C9C4DA;margin-top:6px}
.person-stats b{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--bone)}
.person-reason{font-size:11.5px;color:#FFC2DA;margin-top:5px;line-height:1.4;word-break:break-word}
.person-act{margin-top:9px;display:flex;gap:8px}
.pill{font-size:9px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  padding:2px 7px;border-radius:5px;background:rgba(255,92,158,.16);color:var(--rose)}

.empty{text-align:center;padding:52px 20px;color:var(--mist)}
.empty-drop{width:26px;height:26px;margin:0 auto 14px;background:var(--haze);
  border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
.empty p{font-size:13px;line-height:1.5}

.notice{margin:0 18px 16px;padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.5;
  background:rgba(255,92,158,.10);border:1px solid rgba(255,92,158,.35);color:#FFC2DA}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,140%);
  background:var(--bone);color:#141220;font-weight:700;font-size:13px;
  padding:11px 18px;border-radius:12px;z-index:50;max-width:88vw;text-align:center;
  transition:transform .28s cubic-bezier(.2,.9,.3,1.2)}
.toast.show{transform:translate(-50%,0)}
.toast.bad{background:var(--rose);color:#1A0A12}

/* ── движение ──
   Появление списков, отклик на нажатие и уход карточки после действия.
   Анимируем только opacity и transform: их браузер считает на видеокарте,
   поэтому на слабых телефонах не дёргается. */
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.rise{animation:rise .32s cubic-bezier(.22,.68,.36,1) both}

@keyframes leave{to{opacity:0;transform:scale(.97);filter:blur(1px)}}
.leaving{animation:leave .2s ease forwards;pointer-events:none}

/* панель вкладки проявляется при переключении — только прозрачностью,
   иначе вместе с карточками получается двойное движение */
.panel:not([hidden]){animation:fadeIn .24s ease both}



/* тактильный отклик: элемент слегка проваливается под пальцем */
.btn:active:not(:disabled),
.chip:active:not(:disabled),
.slot:active:not(:disabled),
.day:active,
.mine:active,
.go:active:not(:disabled){transform:scale(.97)}
.btn,.chip,.go{transition:transform .1s ease,background .18s ease,color .18s ease}

/* цифры в шапке мигают, когда меняются */
@keyframes bump{0%{transform:none}35%{transform:scale(1.18)}100%{transform:none}}
.stat b.bump{animation:bump .34s ease}

/* модальное фото не просто проявляется, а подъезжает */
@keyframes zoom{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.photo-modal:not([hidden]) .photo-modal-img{animation:zoom .22s cubic-bezier(.22,.68,.36,1) both}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

.skeleton{height:96px;border-radius:18px;margin-bottom:12px;
  background:linear-gradient(100deg,var(--slate) 30%,var(--haze) 50%,var(--slate) 70%);
  background-size:220% 100%;animation:shimmer 1.3s linear infinite}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="head">
    <div>
      <div class="eyebrow">Панель модерации</div>
      <h1 class="title">Ani<em>DRIP</em></h1>
    </div>
    <button class="menu-btn" id="openPeople" title="Люди">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <span>Люди</span>
    </button>
  </header>

  <div id="notice" class="notice" hidden></div>

  <div class="stats">
    <div class="stat is-new"><b id="statNew">—</b><span>новых</span></div>
    <div class="stat is-queued"><b id="statQueued">—</b><span>в очереди</span></div>
    <div class="stat is-done"><b id="statDone">—</b><span>за сегодня</span></div>
  </div>

  <button class="mine" id="openOwn">
    <span class="plus">＋</span>
    <span>
      <b>Свой пост</b>
      <small>ближайший свободный слот</small>
    </span>
    <span class="next"><em id="nextSlotTime">—</em><span id="nextSlotDay">&nbsp;</span></span>
  </button>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-panel="inbox">Новые</button>
    <button class="tab" role="tab" aria-selected="false" data-panel="queue">Очередь</button>
    <button class="tab" role="tab" aria-selected="false" data-panel="log">История</button>
  </div>

  <div class="scroll">
    <section class="panel" id="inbox"><div class="skeleton"></div><div class="skeleton"></div></section>
    <section class="panel" id="queue" hidden></section>
    <section class="panel" id="log" hidden></section>
  </div>
</div>

<section class="sheet" id="ownSheet" hidden aria-label="Свой пост">
  <div class="sheet-head">
    <button class="back" id="closeOwn" title="Назад">←</button>
    <div>
      <div class="eyebrow">В канал без подписи</div>
      <h2 class="sheet-title">Свой пост</h2>
    </div>
  </div>
  <div class="sheet-body">
    <div class="own-label"><b>Что публикуем</b><span>обычный текст</span></div>
    <div class="editor">
      <textarea id="ownText" placeholder="Текст поста. Можно вставить ссылку — Telegram сам сделает превью."></textarea>
      <div class="editor-foot">
        <span class="count"><span id="ownCount">0</span> / 4096</span>
      </div>
    </div>

    <div class="own-label" style="margin-top:18px"><b>Когда</b><span>сетка канала, каждые два часа</span></div>
    <div class="days" id="ownDays" role="group" aria-label="День публикации"></div>
    <div class="grid" id="ownGrid" role="group" aria-label="Время публикации"></div>
    <p class="own-hint"><b>Жёлтым</b> — слоты, где уже стоит пост из очереди. Выбрать можно и их: посты уйдут подряд.</p>
  </div>
  <div class="own-foot">
    <button class="go" id="ownGo" disabled>Выберите время</button>
  </div>
</section>

<section class="sheet" id="peopleSheet" hidden aria-label="Люди">
  <div class="sheet-head">
    <button class="back" id="closePeople" title="Назад">←</button>
    <div>
      <div class="eyebrow">Кто писал боту</div>
      <h2 class="sheet-title">Люди</h2>
    </div>
  </div>
  <div class="sheet-tools">
    <input class="field search" id="peopleSearch" placeholder="Поиск: имя, @username или ID"
           autocomplete="off" spellcheck="false">
    <div class="chips" style="margin-top:9px">
      <button class="chip filter is-on" data-filter="all">Все</button>
      <button class="chip filter" data-filter="banned">Заблокированные</button>
    </div>
  </div>
  <div class="sheet-body" id="peopleList"><div class="skeleton"></div><div class="skeleton"></div></div>
</section>

<div id="toast" class="toast"></div>

<!-- модальное окно для просмотра фото -->
<div id="photoModal" class="photo-modal" hidden aria-label="Просмотр фото">
  <button class="photo-modal-close" id="closePhotoModal" title="Закрыть">×</button>
  <img id="photoModalImg" class="photo-modal-img" src="" alt="Фото поста">
  <div id="photoModalCaption" class="photo-modal-caption"></div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const $ = (id) => document.getElementById(id);
const initData = tg?.initData || '';
let state = { inbox: [], queue: [], log: [], stats: {}, people: [] };
let busy = false;
const photoCache = {}; // postId -> data:image/... — грузим фото один раз и кэшируем
const avatarCache = {}; // userId -> data:image/... либо null, если аватарки нет

/* ── экранирование: содержимое постов приходит от пользователей ── */
function esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
  ));
}

function toast(text, bad = false) {
  const el = $('toast');
  el.textContent = text;
  el.classList.toggle('bad', bad);
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2600);
}

function haptic(type) {
  try { tg?.HapticFeedback?.notificationOccurred(type); } catch (_) {}
}

async function api(path, body = {}) {
  const res = await fetch('/api/' + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...body, initData })
  });
  const data = await res.json().catch(() => ({ error: 'Сервер не ответил' }));
  if (!res.ok || data.ok === false) throw new Error(data.error || 'Что-то пошло не так');
  return data;
}

/* Закрытие с анимацией: сначала проигрываем уход, потом прячем.
   Без этого экран пропадал мгновенно, хотя открывался плавно. */
function hideAnimated(el, ms = 200) {
  el.classList.add('closing');
  setTimeout(() => {
    el.hidden = true;
    el.classList.remove('closing');
  }, ms);
}

function showNotice(text) {
  const el = $('notice');
  el.textContent = text;
  el.hidden = false;
}

/* ── отрисовка ── */

function emptyBlock(text) {
  return `<div class="empty"><div class="empty-drop"></div><p>${esc(text)}</p></div>`;
}

function renderInbox() {
  const panel = $('inbox');
  if (!state.inbox.length) {
    panel.innerHTML = emptyBlock('Новых предложек нет. Как только кто-то напишет боту, пост появится здесь.');
    return;
  }
  panel.innerHTML = state.inbox.map(p => {
    const initials = (p.author || 'U').split(' ').map(n => n[0] || '').join('').toUpperCase().slice(0, 2);
    return `
    <article class="card" data-card="${p.id}" data-anim="in-${p.id}">
      <div class="card-top">
        <div class="ava-img" data-avatar="${p.userId}" style="background-color:${p.avatarColor || '#2A2838'}">${initials}</div>
        <div>
          <div class="who">${esc(p.author)}</div>
          <div class="when">${esc(p.submittedTime)} · ${esc(p.ago)}</div>
        </div>
        <span class="tag">#${p.id}</span>
      </div>
      ${p.hasPhoto
        ? `<div class="media media-photo" data-viewphoto="${p.id}"><img data-photo="${p.id}" alt="Фото" src="${photoCache[p.id] || ''}"></div>`
        : p.media ? `<div class="media"><span>${esc(p.media)}</span></div>` : ''}
      ${p.preview ? `<p class="body-text">${esc(p.preview)}</p>` : ''}
      <div class="actions">
        <button class="btn btn-pub" data-open="pub-${p.id}">Опубликовать</button>
        <button class="btn btn-later" data-open="lat-${p.id}">Отложить</button>
      </div>
      <div class="actions actions-sub">
        <button class="btn btn-ghost" data-reject="${p.id}">Отклонить</button>
      </div>
      <div class="step" id="pub-${p.id}">
       <div class="step-in">
        <div class="step-q">Показывать автора в канале?</div>
        <div class="chips">
          <button class="chip" data-publish="${p.id}" data-signed="0">Анонимно</button>
          <button class="chip" data-publish="${p.id}" data-signed="1">С подписью ${esc(p.author)}</button>
        </div>
       </div>
      </div>
      <div class="step" id="lat-${p.id}">
       <div class="step-in">
        <div class="step-q">Когда опубликовать?</div>
        <div class="days" data-latdays="${p.id}"></div>
        <div class="grid" data-latgrid="${p.id}"></div>
        <input class="field" id="time-${p.id}" placeholder="или своё: 25.08 20:00">
        <div class="chips" style="margin-top:8px">
          <button class="chip" data-when="${p.id}" data-custom="1" data-signed="0">Отложить анонимно</button>
          <button class="chip" data-when="${p.id}" data-custom="1" data-signed="1">Отложить с подписью</button>
        </div>
       </div>
      </div>
    </article>
  `}).join('');
}

/* ── выбор времени в карточке предложки ── */
/* Та же сетка, что на экране «Свой пост». Выбранное окно хранится
   отдельно для каждого поста, чтобы соседние карточки не мешали. */
const latSel = {};

function latDay(id) {
  return (latSel[id] || {}).day || 0;
}

function latDaysHtml(id) {
  return (state.days || []).map(d => `
    <button class="day" aria-pressed="${d.index === latDay(id)}" data-latday="${id}:${d.index}">
      ${esc(d.name)}<small>${esc(d.date)}</small>
    </button>`).join('');
}

function latGridHtml(id) {
  const day = (state.days || [])[latDay(id)];
  if (!day) return '';
  const chosenTime = (latSel[id] || {}).time;

  return day.slots.map(slot => {
    const past = slot.state === 'past';
    const taken = slot.state === 'taken';
    const chosen = chosenTime === slot.time;
    const label = past ? 'прошло'
                : chosen ? 'выбрано'
                : taken ? 'занято #' + slot.postId
                : 'свободно';
    return `
      <button class="slot ${taken ? 'is-taken' : ''}" data-latslot="${id}:${slot.time}"
              aria-pressed="${chosen}" ${past ? 'disabled' : ''}>
        ${past ? '' : '<span class="slot-dot"></span>'}
        <span class="slot-time">${slot.time}</span>
        <span class="slot-state">${label}</span>
      </button>`;
  }).join('');
}

function renderLat(id) {
  const days = document.querySelector(`[data-latdays="${id}"]`);
  const grid = document.querySelector(`[data-latgrid="${id}"]`);
  if (days) days.innerHTML = latDaysHtml(id);
  if (grid) grid.innerHTML = latGridHtml(id);
}

function renderQueue() {
  const panel = $('queue');
  if (!state.queue.length) {
    panel.innerHTML = emptyBlock('Очередь пуста. Отложите пост из вкладки «Новые», и он появится здесь.');
    return;
  }
  panel.innerHTML = '<div class="rail">' + state.queue.map((p, i) => `
    <div class="drop ${i === 0 ? 'is-next' : ''}" data-anim="q-${p.id}">
      <div class="drop-time">
        ${esc(p.time)} · ${esc(p.day)}
        ${i === 0 ? '<span class="badge-next">Следующий</span>' : ''}
      </div>
      <div class="mini" ${p.hasPhoto ? `data-viewphoto="${p.id}" style="cursor:pointer"` : ''}>
        <div class="mini-row">
          <span class="mini-who">#${p.id} ${p.own ? '· свой пост' : 'от ' + esc(p.author)}</span>
          <span class="mini-mode">${p.signed ? 'с подписью' : 'анонимно'}</span>
        </div>
        ${p.hasPhoto ? `<div class="media media-photo" data-viewphoto="${p.id}"><img data-photo="${p.id}" alt="Фото" src="${photoCache[p.id] || ''}"></div>` : ''}
        ${p.preview ? `<p class="mini-text">${esc(p.preview)}</p>`
                    : `<p class="mini-text">${esc(p.media || 'без текста')}</p>`}
        <div class="mini-acts">
          <button class="link" data-publish="${p.id}" data-signed="${p.signed ? 1 : 0}">Опубликовать сейчас</button>
          <button class="link" data-cancel="${p.id}">Снять</button>
        </div>
      </div>
    </div>
  `).join('') + '</div>';
}

function renderLog() {
  const panel = $('log');
  if (!state.log.length) {
    panel.innerHTML = emptyBlock('Пока ничего не опубликовано.');
    return;
  }
  panel.innerHTML = state.log.map(p => {
    const initials = (p.author || 'U').split(' ').map(n => n[0] || '').join('').toUpperCase().slice(0, 2);
    return `
    <div class="done" data-anim="log-${p.id}" ${p.hasPhoto ? `data-viewphoto="${p.id}" style="cursor:pointer"` : ''}>
      <span class="done-mark"></span>
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:8px">
        <div class="ava-img" data-avatar="${p.userId}" style="background-color:${p.avatarColor || '#2A2838'}">${initials}</div>
        <div>
          <div class="done-time">${esc(p.day)} ${esc(p.time)}</div>
          <div class="done-mode">${p.signed ? 'с подписью ' + esc(p.author) : 'анонимно'}</div>
        </div>
      </div>
      ${p.hasPhoto ? `<div class="media media-photo" data-viewphoto="${p.id}" style="height:60px;margin-bottom:6px"><img data-photo="${p.id}" alt="Фото" src="${photoCache[p.id] || ''}"></div>` : ''}
      <p class="done-text">#${p.id} — ${esc(p.preview || p.media || 'без текста')}</p>
    </div>
  `}).join('');
}

function renderNextSlot() {
  const slot = state.nextSlot;
  $('nextSlotTime').textContent = slot ? slot.time : '—';
  $('nextSlotDay').textContent = slot ? slot.dayName : 'нет окон';
}

/* ── появление списков ──
   Панель перерисовывается каждые несколько секунд. Если запускать
   анимацию на каждой перерисовке, список будет постоянно дёргаться,
   поэтому помним, что уже показывали, и оживляем только новое. */
const shown = new Set();

function animateNew() {
  let i = 0;
  document.querySelectorAll('[data-anim]').forEach(el => {
    const key = el.dataset.anim;
    if (shown.has(key)) return;
    shown.add(key);
    el.style.animationDelay = (i++ * 45) + 'ms';
    el.classList.add('rise');
  });
}

/* цифры в шапке мигают, только когда действительно изменились */
const lastStats = {};

function setStat(id, value) {
  const el = $(id);
  const next = String(value ?? 0);
  if (el.textContent !== next && lastStats[id] !== undefined) {
    el.classList.remove('bump');
    void el.offsetWidth; // перезапуск анимации
    el.classList.add('bump');
  }
  lastStats[id] = next;
  el.textContent = next;
}

function renderAll() {
  renderNextSlot();
  setStat('statNew', state.stats.pending);
  setStat('statQueued', state.stats.scheduled);
  setStat('statDone', state.stats.today);
  renderInbox(); renderQueue(); renderLog();
  animateNew();
  loadMissingPhotos();
  applyAvatars();
}

function applyAvatars() {
  const missing = new Set();

  document.querySelectorAll('.ava-img[data-avatar]').forEach(el => {
    const id = el.dataset.avatar;
    if (!id || id === 'undefined') return;

    const url = avatarCache[id];
    if (url) {
      el.style.backgroundImage = `url("${url}")`;
      // подстраховка: без этого картинка ляжет в натуральную величину
      // и в кружок попадёт только её угол
      el.style.backgroundSize = 'cover';
      el.style.backgroundPosition = 'center';
      el.classList.add('has-photo');
    } else if (url === undefined) {
      // про этого человека ещё не спрашивали сервер
      missing.add(id);
    }
    // url === null значит аватарки нет — оставляем инициалы на цветном фоне
  });

  if (missing.size) loadMissingAvatars([...missing]);
}

async function loadMissingAvatars(ids) {
  try {
    const data = await api('avatars', { userIds: ids });
    // Всё, что сервер не вернул, помечаем как «аватарки нет», иначе будем
    // спрашивать про этих людей при каждой перерисовке.
    ids.forEach(id => { avatarCache[id] = null; });
    Object.entries(data.avatars || {}).forEach(([id, url]) => { avatarCache[id] = url; });
    applyAvatars();
  } catch (_) {
    // без аватарок панель работает как раньше, ошибку не показываем
  }
}

async function loadMissingPhotos() {
  const ids = [
    ...state.inbox.filter(p => p.hasPhoto && !photoCache[p.id]).map(p => p.id),
    ...state.queue.filter(p => p.hasPhoto && !photoCache[p.id]).map(p => p.id),
    ...state.log.filter(p => p.hasPhoto && !photoCache[p.id]).map(p => p.id)
  ];
  for (const id of ids) {
    try {
      const res = await api('photo', { postId: id });
      photoCache[id] = res.dataUrl;
      const imgs = document.querySelectorAll(`img[data-photo="${id}"]`);
      imgs.forEach(img => img.src = res.dataUrl);
    } catch (_) {
      // подпись «фото» всё равно останется видна, ошибку не показываем
    }
  }
}

async function refresh() {
  try {
    state = await api('state');
    renderAll();
  } catch (err) {
    $('inbox').innerHTML = emptyBlock(err.message);
    $('queue').innerHTML = '';
    $('log').innerHTML = '';
    showNotice(err.message);
  }
}

/* ── автообновление: подтягиваем новые посты сами, без перезагрузки ── */
function scheduleAutoRefresh() {
  setInterval(() => {
    // не дёргаем панель, пока админ печатает время или держит открытым
    // шаг с кнопками — иначе слетит то, что он уже начал вводить
    const typing = document.activeElement && document.activeElement.classList.contains('field');
    const stepOpen = document.querySelector('.step.open');
    if (busy || typing || stepOpen || document.hidden) return;
    if (!$('ownSheet').hidden || !$('peopleSheet').hidden) return;
    refresh();
  }, 4000);
}

/* ── действия ── */

async function act(path, body, okText, after) {
  if (busy) return;
  busy = true;
  document.querySelectorAll('.btn, .chip, .link').forEach(b => b.disabled = true);
  try {
    const res = await api(path, body);
    haptic('success');
    toast(res.message || okText);
    // карточка уходит сама, а не исчезает рывком при перерисовке
    const card = body.postId
      ? document.querySelector(`[data-card="${body.postId}"]`)
      : null;
    if (card) {
      card.classList.add('leaving');
      await new Promise(r => setTimeout(r, 200));
    }
    await (after ? after() : refresh());
  } catch (err) {
    haptic('error');
    toast(err.message, true);
    document.querySelectorAll('.btn, .chip, .link').forEach(b => b.disabled = false);
  } finally {
    busy = false;
  }
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t) return;

  if (t.dataset.open) {
    const target = document.getElementById(t.dataset.open);
    const wasOpen = target.classList.contains('open');
    document.querySelectorAll('.step').forEach(s => s.classList.remove('open'));
    if (!wasOpen) {
      // содержимое рисуем до раскрытия, иначе высота посчитается по пустому
      if (t.dataset.open.startsWith('lat-')) renderLat(+t.dataset.open.slice(4));
      target.classList.add('open');
    }
    return;
  }

  if (t.dataset.latday) {
    const [id, index] = t.dataset.latday.split(':');
    latSel[id] = { day: +index };
    renderLat(id);
    return;
  }

  if (t.dataset.latslot) {
    // время содержит двоеточие, поэтому режем только по первому
    const id = t.dataset.latslot.slice(0, t.dataset.latslot.indexOf(':'));
    const time = t.dataset.latslot.slice(t.dataset.latslot.indexOf(':') + 1);
    const current = latSel[id] || {};
    // повторное нажатие снимает выбор
    latSel[id] = current.time === time
      ? { day: current.day || 0 }
      : { day: current.day || 0, time };
    renderLat(id);
    return;
  }

  if (t.dataset.publish) {
    act('publish', { postId: +t.dataset.publish, signed: t.dataset.signed === '1' }, 'Опубликовано');
    return;
  }

  if (t.dataset.reject) {
    act('reject', { postId: +t.dataset.reject }, 'Отклонено');
    return;
  }

  if (t.dataset.banuser) {
    act('ban', { userId: +t.dataset.banuser }, 'Заблокирован', loadPeople);
    return;
  }

  if (t.dataset.unban) {
    act('unban', { userId: +t.dataset.unban }, 'Блокировка снята', loadPeople);
    return;
  }

  if (t.dataset.cancel) {
    act('cancel', { postId: +t.dataset.cancel }, 'Снято');
    return;
  }

  if (t.dataset.when) {
    const id = +t.dataset.when;
    let when = t.dataset.value;
    let signed = t.dataset.signed === '1';
    if (t.dataset.custom) {
      const picked = latSel[id];
      const day = (state.days || [])[(picked || {}).day || 0];
      if (picked && picked.time && day) {
        // «завтра 09:00» — сервер понимает такую запись
        when = `${day.name} ${picked.time}`;
      } else {
        when = document.getElementById('time-' + id).value.trim();
      }
      if (!when) { toast('Выберите время в сетке или впишите своё', true); return; }
    }
    act('schedule', { postId: id, when, signed }, 'Запланировано');
  }
});

/* ── экран «Свой пост» ── */
let ownDays = [];
let ownDay = 0;
let ownSlot = null;

function renderOwnDays() {
  $('ownDays').innerHTML = ownDays.map(d => `
    <button class="day" aria-pressed="${d.index === ownDay}" data-ownday="${d.index}">
      ${esc(d.name)}<small>${esc(d.date)}</small>
    </button>`).join('');
}

function renderOwnGrid() {
  const day = ownDays[ownDay];
  if (!day) { $('ownGrid').innerHTML = ''; return; }

  $('ownGrid').innerHTML = day.slots.map(slot => {
    const chosen = ownSlot === slot.time;
    const past = slot.state === 'past';
    const taken = slot.state === 'taken';
    const label = past ? 'уже прошло'
                : chosen ? 'выбрано'
                : taken ? 'занято #' + slot.postId
                : 'свободно';
    return `
      <button class="slot ${taken ? 'is-taken' : ''}" data-ownslot="${slot.time}"
              aria-pressed="${chosen}" ${past ? 'disabled' : ''}>
        ${past ? '' : '<span class="slot-dot"></span>'}
        <span class="slot-time">${slot.time}</span>
        <span class="slot-state">${label}</span>
      </button>`;
  }).join('');
}

function renderOwnFoot() {
  const btn = $('ownGo');
  const text = $('ownText').value.trim();
  const day = ownDays[ownDay];
  btn.disabled = !ownSlot || !text || busy;
  btn.textContent = ownSlot && day
    ? `Отложить на ${ownSlot}, ${day.name}`
    : (!text ? 'Напишите текст' : 'Выберите время');
}

function renderOwn() {
  renderOwnDays(); renderOwnGrid(); renderOwnFoot();
}

async function openOwn() {
  $('ownSheet').classList.remove('closing');
  $('ownSheet').hidden = false;
  tg?.BackButton?.show();
  $('ownGrid').innerHTML = '<div class="skeleton"></div>';
  try {
    const data = await api('slots');
    ownDays = data.days || [];
    // по умолчанию встаём на ближайшее свободное окно
    if (data.nextSlot && ownSlot === null) {
      ownDay = data.nextSlot.day;
      ownSlot = data.nextSlot.time;
    }
    renderOwn();
  } catch (err) {
    $('ownGrid').innerHTML = emptyBlock(err.message);
  }
}

function closeOwn() {
  hideAnimated($('ownSheet'));
  tg?.BackButton?.hide();
  refresh();
}

async function submitOwn() {
  const text = $('ownText').value.trim();
  if (!text || !ownSlot || busy) return;

  busy = true;
  renderOwnFoot();
  try {
    const res = await api('own', { text, day: ownDay, time: ownSlot });
    haptic('success');
    toast(res.message || 'Отложено');
    $('ownText').value = '';
    $('ownCount').textContent = '0';
    ownSlot = null;
    busy = false;
    closeOwn();
  } catch (err) {
    busy = false;
    haptic('error');
    toast(err.message, true);
    renderOwnFoot();
  }
}

$('openOwn').addEventListener('click', openOwn);
$('closeOwn').addEventListener('click', closeOwn);
$('ownGo').addEventListener('click', submitOwn);

$('ownText').addEventListener('input', (e) => {
  const el = $('ownCount');
  el.textContent = e.target.value.length;
  el.parentElement.classList.toggle('over', e.target.value.length > 4096);
  renderOwnFoot();
});

$('ownSheet').addEventListener('click', (e) => {
  const dayBtn = e.target.closest('[data-ownday]');
  if (dayBtn) {
    ownDay = +dayBtn.dataset.ownday;
    ownSlot = null;
    renderOwn();
    return;
  }
  const slotBtn = e.target.closest('[data-ownslot]');
  if (slotBtn && !slotBtn.disabled) {
    ownSlot = slotBtn.dataset.ownslot === ownSlot ? null : slotBtn.dataset.ownslot;
    renderOwn();
  }
});

/* ── экран людей ── */
let peopleFilter = 'all';
let searchTimer = null;

function personCard(p) {
  const initials = (p.handle || 'U').split(' ').map(n => n[0] || '').join('').toUpperCase().slice(0, 2);
  return `
    <div class="person ${p.banned ? 'is-banned' : ''}" data-anim="ppl-${p.userId}">
      <div class="ava-img" data-avatar="${p.userId}" style="background-color:${p.avatarColor || '#2A2838'}">${initials}</div>
      <div class="person-main">
        <div class="person-who">
          ${esc(p.handle)}
          ${p.banned ? '<span class="pill">бан</span>' : ''}
        </div>
        <div class="person-meta">ID ${p.userId} · писал ${esc(p.lastSeen)}</div>
        <div class="person-stats">
          прислал <b>${p.total}</b> · опубликовано <b>${p.published}</b>${p.pending ? ` · ждёт <b>${p.pending}</b>` : ''}
        </div>
        ${p.banned && p.banReason ? `<div class="person-reason">причина: ${esc(p.banReason)}</div>` : ''}
        <div class="person-act">
          ${p.banned
            ? `<button class="chip" data-unban="${p.userId}">Разблокировать</button>`
            : `<button class="chip" data-banuser="${p.userId}">Заблокировать</button>`}
        </div>
      </div>
    </div>`;
}

async function loadPeople() {
  const list = $('peopleList');
  try {
    const data = await api('people', {
      query: $('peopleSearch').value.trim(),
      onlyBanned: peopleFilter === 'banned'
    });
    state.people = data.people || [];
    if (!data.people.length) {
      list.innerHTML = emptyBlock(
        $('peopleSearch').value.trim()
          ? 'Никого не нашлось. Попробуйте другое имя или ID.'
          : peopleFilter === 'banned'
            ? 'Заблокированных нет.'
            : 'Пока никто не писал боту.'
      );
      return;
    }
    list.innerHTML = data.people.map(personCard).join('');
    animateNew();
    
    applyAvatars();
  } catch (err) {
    list.innerHTML = emptyBlock(err.message);
  }
}

$('openPeople').addEventListener('click', () => {
  $('peopleSheet').classList.remove('closing');
  $('peopleSheet').hidden = false;
  tg?.BackButton?.show();
  loadPeople();
});

function closePeople() {
  hideAnimated($('peopleSheet'));
  tg?.BackButton?.hide();
  refresh();
}
$('closePeople').addEventListener('click', closePeople);
tg?.BackButton?.onClick(() => {
  if (!$('ownSheet').hidden) closeOwn();
  else closePeople();
});

$('peopleSearch').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadPeople, 300);
});

document.querySelectorAll('.chip.filter').forEach(btn => {
  btn.addEventListener('click', () => {
    peopleFilter = btn.dataset.filter;
    document.querySelectorAll('.chip.filter').forEach(b => b.classList.toggle('is-on', b === btn));
    loadPeople();
  });
});

/* вкладки */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t === tab)));
    document.querySelectorAll('.panel').forEach(p => p.hidden = (p.id !== tab.dataset.panel));
    window.scrollTo(0, 0);
  });
});

/* ── просмотр фото: модальное окно ── */
let currentPhotoId = null;

function openPhotoModal(postId) {
  const post = state.inbox.find(p => p.id === postId) || state.queue.find(p => p.id === postId) || state.log.find(p => p.id === postId);
  if (!post || !photoCache[postId]) return;
  
  currentPhotoId = postId;
  $('photoModalImg').src = photoCache[postId];
  $('photoModalCaption').textContent = post.author ? `Пост #${postId} от ${post.author}` : `Пост #${postId}`;
  $('photoModal').classList.remove('closing');
  $('photoModal').hidden = false;
  
  // включаем полный экран через Telegram WebApp (если доступно)
  try { tg?.MainButton?.hide(); } catch (_) {}
}

function closePhotoModal() {
  hideAnimated($('photoModal'), 180);
  setTimeout(() => { $('photoModalImg').src = ''; }, 180);
  currentPhotoId = null;
}

$('closePhotoModal').addEventListener('click', closePhotoModal);

// закрытие по клику вне картинки
$('photoModal').addEventListener('click', (e) => {
  if (e.target === $('photoModal')) closePhotoModal();
});

// делегирование кликов по превью фото
document.addEventListener('click', (e) => {
  const photoContainer = e.target.closest('[data-viewphoto]');
  if (photoContainer) {
    const postId = +photoContainer.dataset.viewphoto;
    // если фото ещё не загружено, пробуем загрузить
    if (!photoCache[postId]) {
      api('photo', { postId }).then(res => {
        photoCache[postId] = res.dataUrl;
        const imgs = document.querySelectorAll(`img[data-photo="${postId}"]`);
        imgs.forEach(img => img.src = res.dataUrl);
        openPhotoModal(postId);
      }).catch(() => toast('Не удалось загрузить фото', true));
    } else {
      openPhotoModal(postId);
    }
  }
});

if (!initData) {
  showNotice('Панель нужно открывать из Telegram — командой /panel в личке с ботом.');
  $('inbox').innerHTML = '';
} else {
  refresh();
  scheduleAutoRefresh();
}
</script>
</body>
</html>
